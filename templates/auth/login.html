<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AutoSocial</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Shared tokens with dashboards */
      --bg-main: radial-gradient(1200px circle at 10% 10%, #1c2a3a 0%, transparent 40%),
                 radial-gradient(1000px circle at 90% 20%, #2d1f3a 0%, transparent 40%),
                 linear-gradient(180deg, #0b0f14, #0e141b);
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.15);
      --text-main: #ffffff;
      --text-soft: #aab4c0;
      --accent-neon: #6cf2d5;
      --accent-gold: #f5d28b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-main);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .auth-card {
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      padding: 36px 32px 32px;
      border-radius: 22px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 30px 80px rgba(0,0,0,.7);
      text-align: center;
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      animation: slideUp 0.5s ease-out;
      position: relative;
      overflow: hidden;
    }

    .auth-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(360px circle at top left, rgba(255,255,255,.16), transparent 55%);
      pointer-events: none;
    }

    @keyframes slideUp {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      position: relative;
      font-size: 1.7rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff, var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.03em;
    }

    .logo i {
      color: var(--accent-neon);
      -webkit-text-fill-color: var(--accent-neon);
    }

    .subtitle {
      position: relative;
      color: var(--text-soft);
      font-size: 0.9rem;
      margin-bottom: 26px;
    }

    /* Alerts */

    .alert {
      position: relative;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .alert-error {
      background: rgba(239,68,68,0.16);
      color: #fecaca;
      border-color: rgba(239,68,68,0.5);
    }

    .alert-success {
      background: rgba(34,197,94,0.18);
      color: #bbf7d0;
      border-color: rgba(34,197,94,0.5);
    }

    .alert i { font-size: 0.95rem; }

    /* Form */

    .form-group {
      margin-bottom: 18px;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    .label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-soft);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #7c8796;
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    input {
      width: 100%;
      padding: 11px 42px 11px 42px; /* Providing space for icons on both sides */
      border: 1px solid rgba(148,163,184,0.45);
      border-radius: 12px;
      font-size: 0.9rem;
      background: rgba(6,10,17,0.92);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input::placeholder {
      color: rgba(148,163,184,0.8);
    }

    input:focus {
      border-color: var(--accent-neon);
      background: rgba(6,10,17,1);
      box-shadow: 0 0 0 1px rgba(108,242,213,0.6);
    }

    .input-wrapper:focus-within i:not(.toggle-password) {
      color: var(--accent-neon);
    }

    .toggle-password {
      position: absolute;
      right: 14px !important;
      left: auto !important;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-neon);
      font-size: 0.95rem;
      cursor: pointer;
      pointer-events: auto !important;
      z-index: 100; /* High z-index to stay above input */
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toggle-password:hover {
      opacity: 1;
      transform: translateY(-50%) scale(1.1);
    }

    /* Hide default browser eye */
    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }

    /* Remember Me Styles */
    .remember-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
    }

    .remember-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-neon);
      cursor: pointer;
      margin: 0;
      padding: 0;
    }

    .remember-label {
      font-size: 0.85rem;
      color: var(--text-soft);
      font-weight: 500;
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -10px;
      margin-bottom: 22px;
    }

    .forgot-link {
      margin: 0 !important;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-neon), #4dd0e1);
      color: #020617;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      position: relative;
      z-index: 1;
      box-shadow: 0 22px 50px rgba(0,0,0,.78);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #4dd0e1, var(--accent-neon));
      box-shadow: 0 28px 70px rgba(0,0,0,.9);
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 18px 40px rgba(0,0,0,.82);
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      margin-top: -10px;
      margin-bottom: 18px;
      color: var(--accent-neon);
      text-decoration: none;
      font-weight: 500;
      position: relative;
      z-index: 1;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: #7cf5e0;
      text-decoration: underline;
    }

    .auth-footer {
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--text-soft);
      position: relative;
      z-index: 1;
    }

    .auth-footer a {
      color: var(--accent-neon);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .auth-footer a:hover {
      color: #7cf5e0;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 22px 26px;
      }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <i class="fa-solid fa-robot"></i>
      AutoSocial
    </div>
    <p class="subtitle">Welcome back. Log in to access your creator dashboard.</p>

    <div id="alert-area">
      {% if message %}
      <div class="alert {% if is_error %}alert-error{% else %}alert-success{% endif %}">
        <i class="fa-solid {% if is_error %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
        {{ message }}
      </div>
      {% endif %}
    </div>

    <form action="/login" method="POST">
      <div class="form-group">
        <label class="label">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" name="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" id="passwordInput" placeholder="••••••••" required>
          <i class="fa-regular fa-eye toggle-password" id="eyeIcon"></i>
        </div>
      </div>

      <div class="auth-options">
        <label class="remember-group">
          <input type="checkbox" name="remember">
          <span class="remember-label">Remember Me</span>
        </label>
        <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a href="/signup">Sign up</a>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const alertArea = document.getElementById('alert-area');

  if (params.has('error')) {
    alertArea.innerHTML = `
      <div class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i> ${params.get('error')}
      </div>`;
  } else if (params.has('success')) {
    alertArea.innerHTML = `
      <div class="alert alert-success">
        <i class="fa-solid fa-circle-check"></i> ${params.get('success')}
      </div>`;
  }

  // Password Visibility Toggle
  const toggleBtn = document.getElementById('eyeIcon');
  const passwordField = document.getElementById('passwordInput');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordField.type === 'password';
    passwordField.type = isPassword ? 'text' : 'password';
    
    // Toggle icon
    toggleBtn.classList.toggle('fa-eye');
    toggleBtn.classList.toggle('fa-eye-slash');
  });
</script>

</body>
</html>
