<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Email | AutoSocial</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: radial-gradient(1200px circle at 10% 10%, #1c2a3a 0%, transparent 40%),
                 radial-gradient(1000px circle at 90% 20%, #2d1f3a 0%, transparent 40%),
                 linear-gradient(180deg, #0b0f14, #0e141b);
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.15);
      --text-main: #ffffff;
      --text-soft: #aab4c0;
      --accent-neon: #6cf2d5;
      --accent-gold: #f5d28b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      padding: 32px 28px 28px;
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,.75);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.45s ease-out;
    }

    .auth-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(340px circle at top left, rgba(255,255,255,.16), transparent 55%);
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      position: relative;
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff, var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.03em;
    }

    .logo i {
      color: var(--accent-neon);
      -webkit-text-fill-color: var(--accent-neon);
    }

    .subtitle {
      position: relative;
      color: var(--text-soft);
      font-size: 0.9rem;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .subtitle strong {
      color: #e5e7eb;
      font-weight: 500;
    }

    /* Alerts */

    .alert-error,
    .alert-success {
      position: relative;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 0.86rem;
      text-align: left;
    }

    .alert-error {
      background: rgba(239,68,68,0.16);
      color: #fecaca;
      border: 1px solid rgba(239,68,68,0.5);
    }

    .alert-success {
      background: rgba(34,197,94,0.16);
      color: #bbf7d0;
      border: 1px solid rgba(34,197,94,0.5);
    }

    /* Form */

    form {
      position: relative;
      z-index: 1;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(148,163,184,0.45);
      border-radius: 12px;
      margin-bottom: 14px;
      box-sizing: border-box;
      background: rgba(6,10,17,0.92);
      color: var(--text-main);
      text-align: center;
      letter-spacing: 6px;
      font-size: 1.2rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input::placeholder {
      color: rgba(148,163,184,0.7);
      letter-spacing: 4px;
    }

    input:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 0 1px rgba(108,242,213,0.6);
      background: rgba(6,10,17,1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-neon), #4dd0e1);
      color: #020617;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 4px;
      position: relative;
      z-index: 1;
      box-shadow: 0 22px 50px rgba(0,0,0,.78);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #4dd0e1, var(--accent-neon));
      box-shadow: 0 28px 70px rgba(0,0,0,.9);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 18px 40px rgba(0,0,0,.82);
    }

    .secondary-link {
      display: block;
      margin-top: 14px;
      color: var(--text-soft);
      text-decoration: none;
      font-size: 0.82rem;
      position: relative;
      z-index: 1;
      transition: color 0.2s ease;
    }

    .secondary-link:hover {
      color: #e5e7eb;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 26px 20px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <i class="fa-solid fa-envelope-circle-check"></i>
      Verify Email
    </div>

    <p class="subtitle">
      We sent a 5‑digit code to <strong>{{ email }}</strong>.<br>
      <span style="font-size: 0.8rem;">(Please check your mail.)</span>
    </p>

    {% if is_error %}
    <div class="alert-error">{{ message }}</div>
    {% elif message %}
    <div class="alert-success">{{ message }}</div>
    {% endif %}

    <form action="/verify-email-submit" method="POST">
      <input type="hidden" name="email" value="{{ email }}">

      <label>Verification Code</label>
      <input
        type="text"
        name="code"
        placeholder="12345"
        required
        maxlength="5"
      >

      <button type="submit" class="btn">Verify Account</button>
    </form>

    <a href="/signup" class="secondary-link">Wrong email? Sign up again</a>
  </div>
</body>
</html>
