<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | AutoSocial</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: radial-gradient(1200px circle at 10% 10%, #1c2a3a 0%, transparent 40%),
                 radial-gradient(1000px circle at 90% 20%, #2d1f3a 0%, transparent 40%),
                 linear-gradient(180deg, #0b0f14, #0e141b);
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.15);
      --text-main: #ffffff;
      --text-soft: #aab4c0;
      --accent-neon: #6cf2d5;
      --accent-gold: #f5d28b;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      color: var(--text-main);
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
      padding: 20px;
    }

    .auth-card {
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      padding: 36px 32px 30px;
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,.8);
      text-align: center;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      animation: slideUp 0.5s ease-out;
      position: relative;
      overflow: hidden;
    }

    .auth-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(380px circle at top left, rgba(255,255,255,.17), transparent 55%);
      pointer-events: none;
    }

    @keyframes slideUp {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      position: relative;
      font-size: 1.7rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff, var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.03em;
    }

    .logo i {
      color: var(--accent-neon);
      -webkit-text-fill-color: var(--accent-neon);
    }

    .subtitle {
      position: relative;
      color: var(--text-soft);
      font-size: 0.9rem;
      margin-bottom: 26px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    .label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-soft);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #7c8796;
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      border: 1px solid rgba(148,163,184,0.45);
      border-radius: 12px;
      font-size: 0.9rem;
      background: rgba(6,10,17,0.92);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input::placeholder {
      color: rgba(148,163,184,0.8);
    }

    input:focus {
      border-color: var(--accent-neon);
      background: rgba(6,10,17,1);
      box-shadow: 0 0 0 1px rgba(108,242,213,0.6);
    }

    .input-wrapper:focus-within i {
      color: var(--accent-neon);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-neon), #4dd0e1);
      color: #020617;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      margin-top: 10px;
      position: relative;
      z-index: 1;
      box-shadow: 0 22px 50px rgba(0,0,0,.8);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #4dd0e1, var(--accent-neon));
      box-shadow: 0 28px 70px rgba(0,0,0,.92);
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 18px 40px rgba(0,0,0,.85);
    }

    .auth-footer {
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--text-soft);
      position: relative;
      z-index: 1;
    }

    .auth-footer a {
      color: var(--accent-neon);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .auth-footer a:hover {
      color: #7cf5e0;
      text-decoration: underline;
    }

    .alert {
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(248,113,113,0.5);
      background: rgba(248,113,113,0.16);
      color: #fecaca;
    }

    .alert i { font-size: 0.9rem; }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 22px 24px;
      }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="logo"><i class="fa-solid fa-robot"></i> AutoSocial</div>
    <p class="subtitle">Join AutoSocial and automate your growth.</p>

    <div id="alert-area">
      {% if message %}
      <div class="alert">
        <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
      </div>
      {% endif %}
    </div>

    <form action="/signup" method="POST" onsubmit="return validatePassword()">
      <div class="form-group">
        <label class="label">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" name="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Create Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" id="password" placeholder="Min. 6 characters" required minlength="6">
        </div>
      </div>

      <div class="form-group">
        <label class="label">Confirm Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-check-double"></i>
          <input type="password" id="confirm_password" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Log In</a>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.has('error')) {
    document.getElementById('alert-area').innerHTML = `
      <div class="alert">
        <i class="fa-solid fa-circle-exclamation"></i> ${params.get('error')}
      </div>`;
  }

  function validatePassword() {
    const p1 = document.getElementById("password").value;
    const p2 = document.getElementById("confirm_password").value;

    if (p1 !== p2) {
      document.getElementById('alert-area').innerHTML = `
        <div class="alert">
          <i class="fa-solid fa-triangle-exclamation"></i> Passwords do not match!
        </div>`;
      return false;
    }
    return true;
  }
</script>

</body>
</html>
